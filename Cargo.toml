[package]
name = "doug"
version = "0.1.0"
authors = ["Cole Poirier <colepoirier@gmail.com>"]
edition = "2021"

[dependencies]
bevy_editor_cam = "0.5"
layout21 = { git = "https://github.com/colepoirier/Layout21" }
vlsir = { git = "https://github.com/colepoirier/Vlsir", tag = "v0.2.2" }

[dependencies.bevy]
version = "0.15.1"
default-features = false
features = [
    "bevy_mesh_picking_backend",
    "bevy_picking",
    "bevy_render",
    "bevy_sprite",
    "bevy_state",
    "bevy_winit",
    "bevy_window",
    "dynamic_linking",
    "multi_threaded",
]

[profile.fast-dev]
inherits = "dev"
package.layout21.opt-level = 3
package."*".opt-level = 1

[profile.test]
opt-level = 3
